################
### MONITORS ###
################

#source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = nemo
$menu = wofi --show drun
$lockscreen = hyprlock
#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = hyprpaper
exec-once = $lockscreen
exec-once = mako
exec-once = aw-qt
exec-once = ~/.cargo/bin/aw-watcher-window-hyprland


exec-once = eww open bar

# Idle Daemon
exec-once = hypridle

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

env = OZONE_PLATFORM, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, gtk3

env = LIBVA_DRIVER_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,0
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(607b91aa) rgba(456775aa) 45deg
    col.inactive_border = rgba(404040aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 10
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    middle_click_paste = false
    focus_on_activate = true # I think it will fix freecad
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us, cz
    kb_variant =  , qwerty
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    gesture = 3, horizontal, workspace
    gesture = 3, vertical, special, special
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
    force_zero_scaling = true
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod ALT, escape, exit,
bind = $mainMod, M, exec, pear-desktop
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, X, exec, hyprctl --batch "dispatch setfloating; dispatch resizeactive exact 1000 600; dispatch moveactive exact 300 1410;"
bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating ; dispatch resizeactive exact 1000 600; dispatch centerwindow"
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, exec, nwg-displays
bind = $mainMod, D, exec, vesktop vesktop --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod, E, exec, wofi-emoji
bind = $mainMod, W, exec, ~/.config/hypr/scripts/show_wifi
bind = $mainMod, B, exec, ~/.config/hypr/scripts/show_bt
bind = $mainMod, S, movetoworkspace, special:special
bind = $mainMod, TAB, cyclenext
bind = $mainMod ALT, right, movewindow, mon:+1
bind = $mainMod ALT, left, movewindow, mon:-1


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Bind the Power Button to your toggle script
bind = , XF86PowerOff, exec, ~/.config/hypr/scripts/show_bat

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && bash ~/.config/hypr/scripts/show_volume & wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && bash ~/.config/hypr/scripts/show_volume &
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && bash ~/.config/hypr/scripts/show_volume &
bindel = ,XF86AudioMicMute, exec, playerctl play-pause # I need it more than mic mute
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+ && bash ~/.config/hypr/scripts/show_bright &
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%- && bash ~/.config/hypr/scripts/show_bright &
bind = $mainMod, i, exec, hyprpicker -a
bind = $mainMod, l, exec, $lockscreen

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


bind = $mainMod SHIFT, S, exec, IMG=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png && grim -g "$(slurp)" $IMG && wl-copy < $IMG
bind = $mainMod, i, exec, hyprpicker -a


bind = $mainMod ALT, 1, exec, hyprctl keyword cursor:zoom_factor 1.0
bind = $mainMod ALT, 2, exec, hyprctl keyword cursor:zoom_factor 2.0
bind = $mainMod ALT, 3, exec, hyprctl keyword cursor:zoom_factor 3.0
bind = $mainMod ALT, 4, exec, hyprctl keyword cursor:zoom_factor 4.0
bind = $mainMod ALT, 5, exec, hyprctl keyword cursor:zoom_factor 5.0
bind = $mainMod ALT, 6, exec, hyprctl keyword cursor:zoom_factor 6.0
bind = $mainMod ALT, 7, exec, hyprctl keyword cursor:zoom_factor 7.0
bind = $mainMod ALT, 8, exec, hyprctl keyword cursor:zoom_factor 8.0
bind = $mainMod ALT, 9, exec, hyprctl keyword cursor:zoom_factor 9.0
bind = $mainMod ALT, 0, exec, hyprctl keyword cursor:zoom_factor 10.0
bind = $mainMod ALT, MINUS, exec, hyprctl keyword cursor:zoom_factor 20.0
bind = $mainMod ALT, EQUAL, exec, hyprctl keyword cursor:zoom_factor 100.0

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = opacity 0.8 0.8, match:title foot
windowrule = opacity 0.7 0.7, match:title foot, match:float true

windowrule = opacity 0.95 0.95, match:float true
windowrule = border_size 2, match:float true
windowrule = rounding 10, match:float true

# File open
windowrule = float on, match:title Open Folder|Open File|Save File|Select File|Choose File|Choose one.*
windowrule = center on, match:title Open Folder|Open File|Save File|Select File|Choose File|Choose one.*
windowrule = size monitor_w*0.6 monitor_h*0.7, match:title Open Folder|Open File|Save File|Select File|Choose File|Choose one.*

# Side widget
windowrule = match:title float_side, float on
windowrule = size monitor_w*0.3 monitor_h*0.5, match:title float_side
windowrule = move monitor_w-window_w*0.6 monitor_h-window_h*0.5, match:title float_side
windowrule = match:title float_side, pin on
windowrule = match:title float_side, border_size 0
windowrule = match:title float_side, opacity 0.8
